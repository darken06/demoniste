<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ok go</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background-color: #f4f4f4;
  }
  button {
    padding: 12px 24px;
    font-size: 18px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background-color: #0078d4;
    color: white;
  }
  button:hover {
    background-color: #005a9e;
  }
  button:disabled {
    background-color: #a0a0a0;
    cursor: not-allowed;
  }
  #message {
    margin-top: 16px;
    font-size: 16px;
    color: green;
    min-height: 20px;
    text-align: center;
    max-width: 320px;
  }
</style>
</head>
<body>
  <button id="copyBtn" disabled>Ok Go</button>
  <div id="message">Chargement...</div>

  <script>
    const bouton = document.getElementById("copyBtn");
    const message = document.getElementById("message");

    const NOM_FICHIER = "test.dar"; // doit être au même niveau que cette page
    const DUREE_AVANT_EFFACEMENT_MS = 20000; // 20 secondes
    let minuteurEffacement = null;
    let chaineLu = null;

    fetch(NOM_FICHIER)
      .then((reponse) => {
        if (!reponse.ok) {
          throw new Error("Fichier introuvable");
        }
        return reponse.text();
      })
      .then((contenu) => {
        chaineLu = contenu.replace(/\r?\n$/, "");
        bouton.disabled = false;
        message.style.color = "green";
        message.textContent = "Chargé, prêt à copier.";
      })
      .catch(() => {
        message.style.color = "red";
        message.textContent = "Impossible de charger " + NOM_FICHIER + ".";
      });

    bouton.addEventListener("click", () => {
      const texteACopier = chaineLu;
      if (!texteACopier) {
        message.style.color = "red";
        message.textContent = "Rien n'est chargé.";
        return;
      }

      navigator.clipboard.writeText(texteACopier)
        .then(() => {
          message.style.color = "green";
          message.textContent = "Copié: Effacement dans 20 secondes.";

          // Annule un effacement précédent encore en attente
          if (minuteurEffacement) {
            clearTimeout(minuteurEffacement);
          }

          minuteurEffacement = setTimeout(() => {
            navigator.clipboard.readText()
              .then((contenuActuel) => {
                if (contenuActuel === texteACopier) {
                  return navigator.clipboard.writeText("");
                }
              })
              .then(() => {
                message.textContent = "Presse-papier effacé.";
              })
              .catch(() => {
                // La lecture du presse-papier peut être refusée par le
                // navigateur (permission) : on ignore silencieusement.
              });
          }, DUREE_AVANT_EFFACEMENT_MS);
        })
        .catch(() => {
          message.style.color = "red";
          message.textContent = "Erreur lors de la copie.";
        });
    });
  </script>
</body>
</html>
